
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

.container {
  position: relative;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 500 / 550;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent !important;
}

.candle-button {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  width: 270px;
  height: 350px;
  padding: 0;
  border: none;
  outline-offset: 6px;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.candle-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.flame {
  transform-origin: 135px 92px;
  animation: flameMove 2.2s ease-in-out infinite alternate;
  transition: opacity 1.4s ease;
}

.flame-core {
  animation: flameLight 1.7s ease-in-out infinite alternate;
}

.glow {
  transform-origin: 135px 92px;
  animation: glowMove 2.5s ease-in-out infinite alternate;
  transition: opacity 1.4s ease;
}

@keyframes flameMove {
  0% {
    transform: rotate(-3deg) scaleX(.95);
  }
  50% {
    transform: rotate(2deg) scaleX(1.04);
  }
  100% {
    transform: rotate(-1deg) scaleX(.98);
  }
}

@keyframes flameLight {
  0% { opacity: .75; }
  100% { opacity: 1; }
}

@keyframes glowMove {
  0% {
    opacity: .35;
    transform: scale(.95);
  }
  100% {
    opacity: .65;
    transform: scale(1.1);
  }
}

.candle-button.extinguished .flame,
.candle-button.extinguished .glow {
  opacity: 0;
  animation: none;
}

.timer {
  position: absolute;
  left: 50%;
  bottom: 8%;
  transform: translateX(-50%);
  color: #d6b19a;
  font-size: 56px;
  font-weight: 300;
  letter-spacing: 5px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 14px rgba(201,123,75,.18);
  opacity: 0;
  transition: opacity .6s ease;
  pointer-events: none;
}

.timer.visible {
  opacity: 1;
}

.timer.last-seconds {
  color: #d68b68;
}

.timer.finished {
  color: #a6a6a6;
}

@media (max-width: 500px) {
  .candle-button {
    width: 54%;
    height: 64%;
  }

  .timer {
    font-size: clamp(26px, 10vw, 56px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .flame, .flame-core, .glow {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="container">

  <button
    class="candle-button"
    id="candleButton"
    aria-label="点击蜡烛开始一分钟倒计时"
    title="点击蜡烛开始倒计时"
  >

    <svg class="candle-svg"
         viewBox="0 0 270 350"
         xmlns="http://www.w3.org/2000/svg">

      <defs>

        <linearGradient id="waxGradient"
                        x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8f817b"/>
          <stop offset="20%" stop-color="#c7b9ac"/>
          <stop offset="50%" stop-color="#e2d4c3"/>
          <stop offset="80%" stop-color="#b5a69b"/>
          <stop offset="100%" stop-color="#81736d"/>
        </linearGradient>

        <radialGradient id="flameGradient"
                        cx="50%" cy="70%" r="70%">
          <stop offset="0%" stop-color="#fff5c9"/>
          <stop offset="35%" stop-color="#f8cf87"/>
          <stop offset="75%" stop-color="#d98748"/>
          <stop offset="100%" stop-color="#9d4e2b"/>
        </radialGradient>

        <radialGradient id="glowGradient">
          <stop offset="0%" stop-color="#f5b96d"
                stop-opacity=".45"/>
          <stop offset="60%" stop-color="#df8d46"
                stop-opacity=".15"/>
          <stop offset="100%" stop-color="#df8d46"
                stop-opacity="0"/>
        </radialGradient>

      </defs>

      <!-- 火焰光晕 -->
      <g class="glow">
        <ellipse
          cx="135"
          cy="94"
          rx="70"
          ry="92"
          fill="url(#glowGradient)"
        />
      </g>

      <!-- 蜡烛火焰 -->
      <g class="flame">

        <path
          d="M135 27
             C148 49 155 67 150 84
             C147 99 141 108 135 110
             C124 107 118 97 120 82
             C121 64 130 46 135 27Z"
          fill="url(#flameGradient)"
        />

        <path
          class="flame-core"
          d="M135 62
             C143 76 143 91 135 103
             C127 94 127 79 135 62Z"
          fill="#fff2cb"
          opacity=".9"
        />

      </g>

      <!-- 烛芯 -->
      <path
        d="M135 108 Q133 119 135 132"
        stroke="#40342e"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
      />

      <!-- 蜡烛主体 -->
      <path
        d="M88 131
           Q135 119 182 131
           L182 301
           Q135 319 88 301Z"
        fill="url(#waxGradient)"
      />

      <!-- 蜡烛顶部 -->
      <ellipse
        cx="135"
        cy="132"
        rx="47"
        ry="12"
        fill="#d7c8b9"
      />

      <ellipse
        cx="135"
        cy="132"
        rx="38"
        ry="7"
        fill="#b9a99b"
        opacity=".55"
      />

      <!-- 蜡油滴落 -->
      <path
        d="M101 133
           Q104 153 101 173
           Q99 186 106 185
           Q112 184 109 171
           L109 137"
        fill="#d9c9b8"
        opacity=".9"
      />

      <path
        d="M167 134
           Q163 156 167 178
           Q170 187 175 181
           Q177 176 173 161
           L173 134"
        fill="#c8b7aa"
        opacity=".85"
      />

      <!-- 蜡烛底部阴影 -->
      <ellipse
        cx="135"
        cy="303"
        rx="47"
        ry="11"
        fill="#8c7d74"
        opacity=".55"
      />

      <!-- 底座 -->
      <ellipse
        cx="135"
        cy="319"
        rx="78"
        ry="13"
        fill="#7b7774"
        opacity=".65"
      />

      <ellipse
        cx="135"
        cy="316"
        rx="67"
        ry="9"
        fill="#a19b95"
      />

    </svg>

  </button>

  <!-- 倒计时数字 -->
  <div class="timer" id="timer" aria-live="off">
    01:00
  </div>

</div>

<script>
const candleButton =
  document.getElementById("candleButton");

const timerElement =
  document.getElementById("timer");

let remaining = 60;
let countdown = null;
let running = false;
let audioContext = null;
let endTime = 0;

// 初始化音频
function initAudio() {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContextClass) {
      audioContext = new AudioContextClass();
    }
  }

  if (audioContext && audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// 轻柔倒计时提示音
function playTick(finalSeconds = false) {
  if (!audioContext) return;

  const now = audioContext.currentTime;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(
    finalSeconds ? 740 : 520,
    now
  );

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    finalSeconds ? 0.045 : 0.025,
    now + 0.012
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.13
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.14);
}

// 结束提示音
function playFinish() {
  if (!audioContext) return;

  const now = audioContext.currentTime;

  [0, 0.28, 0.56].forEach((delay,index) => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      [520,440,350][index],
      now + delay
    );

    gain.gain.setValueAtTime(
      0.0001,
      now + delay
    );

    gain.gain.exponentialRampToValueAtTime(
      0.055,
      now + delay + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + delay + 0.55
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now + delay);
    oscillator.stop(now + delay + 0.57);
  });
}

// 格式化倒计时
function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}

// 更新画面
function updateTimer() {
  timerElement.textContent = formatTime(remaining);

  timerElement.classList.toggle(
    "last-seconds",
    remaining <= 10 && remaining > 0
  );
}

// 结束倒计时
function finishCountdown() {
  clearInterval(countdown);
  countdown = null;
  running = false;
  remaining = 0;

  updateTimer();

  timerElement.classList.remove("last-seconds");
  timerElement.classList.add("finished");

  candleButton.classList.add("extinguished");

  candleButton.setAttribute(
    "aria-label",
    "倒计时结束，点击蜡烛重新开始"
  );

  playFinish();
}

// 开始倒计时
function startCountdown() {
  if (running) return;

  initAudio();

  clearInterval(countdown);

  running = true;
  remaining = 60;

  candleButton.classList.remove("extinguished");
  timerElement.classList.remove("finished");

  updateTimer();
  timerElement.classList.add("visible");

  candleButton.setAttribute(
    "aria-label",
    "一分钟倒计时进行中"
  );

  // 使用实际时间计算，避免浏览器计时误差
  endTime = performance.now() + 60000;

  let lastSecond = 60;

  countdown = setInterval(() => {
    const millisecondsLeft =
      Math.max(0,endTime-performance.now());

    const newRemaining =
      Math.ceil(millisecondsLeft/1000);

    if (newRemaining !== lastSecond) {
      remaining = newRemaining;
      lastSecond = newRemaining;

      updateTimer();

      if (remaining > 0) {
        playTick(remaining <= 10);
      }
    }

    if (millisecondsLeft <= 0) {
      finishCountdown();
    }
  }, 50);
}

// 点击蜡烛
candleButton.addEventListener("click",() => {
  if (!running) {
    startCountdown();
  }
});

// 页面离开时停止计时器
window.addEventListener("pagehide",() => {
  if (countdown) {
    clearInterval(countdown);
    countdown = null;
  }
});
</script>

</body>
</html>
